<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f0e13">
<title>{{ song.title }}{% if song.artist %} · {{ song.artist }}{% endif %}</title>
<meta property="og:type" content="music.song">
<meta property="og:site_name" content="{{ server_name }}">
<meta property="og:title" content="{{ song.title }}{% if song.artist %} · {{ song.artist }}{% endif %}">
<meta property="og:description" content="Somebody shared a song with you. Tap to listen.">
<meta property="og:url" content="{{ url }}">
{% if song.art %}<meta property="og:image" content="{{ song.art }}">
<meta name="twitter:image" content="{{ song.art }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ song.title }}{% if song.artist %} · {{ song.artist }}{% endif %}">
<meta name="twitter:description" content="Somebody shared a song with you. Tap to listen.">
<style>
:root{--bg:#0f0e13;--ink:#f4f1ec;--sub:#a29d95;--line:#26242c;--accent:#e8a262;--accent-ink:#1a1107;
  --sans:ui-sans-serif,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);display:grid;place-items:center;
  padding:24px;overflow:hidden;-webkit-font-smoothing:antialiased}
.wash{position:fixed;inset:-20%;z-index:0;background-size:cover;background-position:center;
  filter:blur(70px) saturate(1.4);opacity:.45;transform:scale(1.2)}
main{position:relative;z-index:1;width:min(380px,100%);text-align:center}
.cover{width:min(300px,78vw);aspect-ratio:1;border-radius:18px;margin:0 auto 22px;background:#222 center/cover;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.8)}
h1{font:800 24px/1.2 var(--display);letter-spacing:-.02em}
.by{color:var(--sub);margin-top:4px;font-size:16px}
.play{margin:24px auto 0;width:66px;height:66px;border-radius:50%;border:0;background:var(--ink);color:#111;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.play svg{width:28px;height:28px;fill:currentColor}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:22px 8px 6px;overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--ink)}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin:0 8px;font-variant-numeric:tabular-nums}
.note{margin-top:14px;font-size:12.5px;color:var(--sub);min-height:1.5em}
.links{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.links a{font-size:13px;color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.04)}
.links a.spot{border-color:#1db95488;color:#6ee79a}
.links a:hover{border-color:var(--sub)}
</style>
</head>
<body>
<div class="wash" {% if song.art %}style="background-image:url('{{ song.art }}')"{% endif %}></div>
<main>
  <div class="cover" {% if song.art %}style="background-image:url('{{ song.art }}')"{% endif %}></div>
  <h1>{{ song.title }}</h1>
  {% if song.artist %}<p class="by">{{ song.artist }}</p>{% endif %}
  <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="icon"><path d="M8 5v14l11-7z"/></svg></button>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="times"><span id="at">0:00</span><span id="len">{% if song.duration %}{{ (song.duration // 60) }}:{{ '%02d' % (song.duration % 60) }}{% endif %}</span></div>
  <p class="note" id="note"></p>
  <div class="links">
    <a class="spot" id="spot" hidden target="_blank" rel="noopener">Open in Spotify</a>
    <a href="{{ base }}/">Get your own</a>
  </div>
  <audio id="audio" preload="none" playsinline></audio>
</main>
<script>
const SID = {{ song.id | tojson }}, BASE = {{ base | tojson }};
const audio = document.getElementById("audio"), $ = id => document.getElementById(id);
// The format this browser plays; an iPhone can't do Opus in WebM.
const FMT = (() => { const p = document.createElement("audio");
  for (const [n, t] of [["webm", 'audio/webm; codecs="opus"'], ["mp4opus", 'audio/mp4; codecs="opus"']])
    if (p.canPlayType && p.canPlayType(t) === "probably") return n;
  return "aac"; })();
const src = BASE + "/s/" + SID + "/audio?fmt=" + FMT;
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
let waiting = false;
async function ready() {
  // Fetched on first open if it wasn't already here; a 503 means "nearly".
  for (let i = 0; i < 60; i++) {
    const r = await fetch(src, { method: "GET", headers: { Range: "bytes=0-1" } }).catch(() => null);
    if (r && (r.status === 206 || r.status === 200)) return true;
    $("note").textContent = "Getting it ready…";
    await new Promise(res => setTimeout(res, 2000));
  }
  return false;
}
$("play").onclick = async () => {
  if (!audio.paused) { audio.pause(); return; }
  if (!audio.src) {
    if (waiting) return;
    waiting = true;
    const ok = await ready();
    waiting = false;
    if (!ok) { $("note").textContent = "Couldn't get this one ready. Try again in a minute."; return; }
    audio.src = src;
  }
  $("note").textContent = "";
  audio.play().catch(() => { $("note").textContent = "Tap play again to start it."; });
};
audio.onplay = () => $("icon").innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
audio.onpause = () => $("icon").innerHTML = '<path d="M8 5v14l11-7z"/>';
audio.ontimeupdate = () => {
  $("at").textContent = mmss(audio.currentTime);
  if (audio.duration) { $("fill").style.width = (100 * audio.currentTime / audio.duration) + "%";
                        $("len").textContent = mmss(audio.duration); }
};
$("bar").onclick = e => {
  if (!audio.duration) return;
  const r = $("bar").getBoundingClientRect();
  audio.currentTime = audio.duration * Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
};
fetch(BASE + "/s/" + SID + "/spotify").then(r => r.json()).then(j => {
  if (j && j.spotify) { $("spot").href = j.spotify; $("spot").hidden = false; }
}).catch(() => {});
</script>
</body>
</html>

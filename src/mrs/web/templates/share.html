<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{ song.title }}{% if song.artist %} - {{ song.artist }}{% endif %}</title>
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#2B2D31">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ song.title }}{% if song.artist %} - {{ song.artist }}{% endif %}">
<meta property="og:url" content="{{ url }}">
<meta property="og:image" content="{{ cover }}">
<meta property="og:image:secure_url" content="{{ cover }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="{{ width }}">
<meta property="og:image:height" content="{{ height }}">
<meta property="og:image:alt" content="{{ song.title }}{% if song.artist %} by {{ song.artist }}{% endif %}">
<meta name="twitter:title" content="{{ song.title }}{% if song.artist %} - {{ song.artist }}{% endif %}">
<meta name="twitter:image" content="{{ cover }}">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;
  background:#0d0e12;color:#f6f5fa;font:15px/1.5 system-ui,sans-serif;padding:20px}
main{width:min(360px,100%)}.card{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:18px;
  box-shadow:0 20px 60px #0005}.actions{display:flex;gap:16px;align-items:center;
  justify-content:space-between;padding:15px 4px}p{margin:0;color:#b8b7c2;font-size:13px}
button{border:0;border-radius:12px;background:#f5f4f9;color:#171820;font:600 13px system-ui;
  padding:12px 18px;cursor:pointer;white-space:nowrap}button:hover{background:white}
button:focus-visible{outline:3px solid #aab7ff;outline-offset:4px}button:disabled{opacity:.6}
@media(max-width:480px){.actions{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
  <img class="card" src="{{ cover }}" width="{{ width }}" height="{{ height }}" alt="{{ song.title }} by {{ song.artist }}">
  <form class="actions" id="open" action="{{ base }}/s/{{ song.id }}/player" method="post">
    <p id="note" role="status">Opening your private player…</p>
    <button id="start" type="submit">Open player</button>
  </form>
</main>
<script>
const form = document.getElementById("open"), note = document.getElementById("note"),
      button = document.getElementById("start");
let opening = false;
async function openPlayer() {
  if (opening) return;
  opening = true; button.disabled = true;
  note.textContent = "Opening your private player…";
  try {
    const response = await fetch(form.action, {method:"POST", headers:{Accept:"application/json"}});
    const data = await response.json();
    if (!response.ok || !data.url) throw new Error(data.detail || "Couldn't open this song.");
    location.replace(data.url);
  } catch (error) {
    note.textContent = error.message || "Couldn't connect. Try again.";
    opening = false; button.disabled = false;
  }
}
form.addEventListener("submit", event => { event.preventDefault(); openPlayer(); });
// Crawlers read the metadata/image; a real browser starts its own visit.
openPlayer();
</script>
</body>
</html>
